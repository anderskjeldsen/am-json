id: "am-json"
version: "1.0.0"
type: "application"
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
#    type: local
#    path: ../am-lang-core
  - id: am-tests
    testOnly: true
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-tests.git
platforms:
  - id: libc
    abstract: true
  - id: "linux-x64"
    extends: "libc"
    gccCommand: "gcc"
  - id: "macos-arm"
    extends: "libc"
    gccCommand: "gcc"
  - id: linux-ppc32
    extends: libc
    gccCommand: powerpc-linux-gnu-gcc -O1
    gccAdditionalOptions:
      - -pthread
  - id: linux-ppc64
    extends: linux-ppc32
    gccCommand: powerpc-linux-gnu-gcc -O2
  # AmigaOS m68k (cross-compiled in the amiga-gcc docker image). Mirrors
  # am-uix's amigaos platform; used to exercise the am-cc C compiler.
  - id: amigaos
    extends: libc
    gccCommand: m68k-amigaos-gcc -O3
    gccAdditionalOptions:
      - -noixemul
    additionalLinkerFlags:
      - -noixemul

  # Shared AROS base (all architectures) — see am-lang-core's `aros`.
  - id: aros
    abstract: true
    extends: libc

  - id: aros-arm64
    extends: aros
    gccCommand: aarch64-aros-gcc -O2
    gccAdditionalOptions:
      - -fno-common   # AROS's loader REFUSES COMMON symbols; gcc 6.5.0 defaults to -fcommon
      - -D_REENTRANT  # aarch64-aros-gcc rejects -pthread outright
    additionalLinkerFlags:
      - -lpthread     # no driver links it without -pthread, which AROS gcc rejects
buildTargets:
  - id: "macos-arm"
    platform: "macos-arm"
  - id: aros-arm64-docker
    platform: aros-arm64
    dockerBuild:
      image: aros-arm64-native:latest
      buildPath: /host
  - id: "linux-x64"
    platform: "linux-x64"
  - id: amigaos_docker
    platform: amigaos
    dockerBuild:
      image: amiga-gcc:latest
      buildPath: /host
