id: "json-viewer-example"
version: "1.0.0"
type: "application"
dependencies:
  - id: am-lang-core
    realm: github
    type: git-repo
    tag: latest
    url: https://github.com/anderskjeldsen/am-lang-core.git
    features: ["floatingPoint"]
#    type: local
#    path: /home/anders/Projects/AmLang/am-lang-core
  - id: am-json
    type: local
    path: ../..
platforms:
  - id: libc
    abstract: true
  - id: "linux-x64"
    extends: libc
    gccCommand: "gcc"
  - id: "macos"
    extends: libc
    gccCommand: "gcc"
buildTargets:
  - id: "linux-x64"
    platform: "linux-x64"
  - id: "macos"
    platform: "macos"